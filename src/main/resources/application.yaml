# application.yml - الإصدار المعدل
server:
  port: 8080

spring:
  application:
    name: student-exchange
  
  datasource:
    # اتصل بقاعدة البيانات الافتراضية postgres أولاً
    url: jdbc:postgresql://localhost:5433/student_exchange_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    data: classpath:data.sql
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
# ============================================================
# إعدادات JWT
# ============================================================
app:
  jwt:
    secret: this-is-a-very-long-secret-key-for-jwt-token-generation-2024-minimum-256-bits
    expiration: 86400000

    # ============================================================
    # ✅ مجلد حفظ الصور الرمزية
    # ============================================================
  upload:
    avatar-dir: uploads/avatars  # المجلد النسبي داخل المشروع

logging:
  level:
    root: INFO
    com.eleraky: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG