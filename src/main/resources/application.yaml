# application.yml - الإصدار المعدل
server:
  port: 8080

spring:
  application:
    name: student-exchange
  
  datasource:
    # اتصل بقاعدة البيانات الافتراضية postgres أولاً
    url: jdbc:postgresql://localhost:5433/student_exchange_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.eleraky: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG